              - guillermo.hre@gmail.com
            on_failure:
              - guillermo.hre@gmail.com
        - task_key: create_tables
          depends_on:
            - task_key: create_volumenes
          sql_task:
            file:
              path: /Workspace/Users/guillermo.hre@gmail.com/CienciaDeDatos/dev/code/DDL/tablas.sql
              source: WORKSPACE
            warehouse_id: 7e4ed7b4d29d0996
          email_notifications:
