    cor_dev_setup:
      name: cor_dev_setup
      tasks:
        - task_key: create_schemas
          sql_task:
            file:
              path: /Workspace/Users/guillermo.hre@gmail.com/CienciaDeDatos/dev/code/DDL/esquemas.sql
              source: WORKSPACE
            warehouse_id: 7e4ed7b4d29d0996
          email_notifications:
            on_success:
