resources:
  jobs:
    cor_train_ml:
      name: cor_train_ml
      tasks:
        - task_key: wave_classifier
          spark_python_task:
            python_file: ../../code/ML/wave_classifier/crear_wave_classifier.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          environment_key: Default

      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED