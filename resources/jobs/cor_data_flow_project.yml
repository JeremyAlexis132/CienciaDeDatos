resources:
  jobs:
    cor_data_flow_project:
      name: cor_data_flow_project
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/cor_project/bronze/data/landing/
      tasks:
        - task_key: landing_to_bronze
          spark_python_task:
            python_file: ../../code/ELT/landing_to_bronze.py
            parameters:
              - "--ambiente"
              - "project"
          email_notifications:
            on_success:
              - guillermo.hre@gmail.com
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          spark_python_task:
            python_file: ../../code/ELT/bronze_to_silver.py
            parameters:
              - "--ambiente"
              - "project"
          email_notifications:
            on_success:
              - guillermo.hre@gmail.com
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED