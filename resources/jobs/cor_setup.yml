resources:
  jobs:
    cor_setup:
      name: cor_setup
      tasks:
        - task_key: setup_schemas
          spark_python_task:
            python_file: ../../code/DDL/esquemas.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_success:
              - guillermo.hre@gmail.com
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: setup_tables
          depends_on:
            - task_key: setup_schemas
          spark_python_task:
            python_file: ../../code/DDL/tablas.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_success:
              - guillermo.hre@gmail.com
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: setup_volumes
          depends_on:
            - task_key: setup_tables
          spark_python_task:
            python_file: ../../code/DDL/volumenes.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
