resources:
  jobs:
    cor_data_flow_dev:
      name: cor_data_flow_dev
      tasks:
        - task_key: landing_to_bronze
          notebook_task:
            notebook_path: ../../code/ELT/dev/landing_to_bronze.ipynb
            base_parameters:
              ambiente: dev
          environment_key: Default
        - task_key: bronze_to_silver
          depends_on:
              - task_key: landing_to_bronze
          notebook_task:
            notebook_path: ../../code/ELT/dev/bronze_to_silver.ipynb
            base_parameters:
              ambiente: dev
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED