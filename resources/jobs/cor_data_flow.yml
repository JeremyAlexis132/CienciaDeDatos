resources:
  jobs:
    cor_data_flow:
      name: cor_data_flow
      tasks:
        - task_key: landing_to_bronze
          spark_python_task:
            python_file: ../../code/ETL/project/landing_to_raw_swell_metrics.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          run_if: AT_LEAST_ONE_SUCCESS
          spark_python_task:
            python_file: ../../code/ETL/project/raw_swell_metrics_to_swell_metrics.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: validar_existencia_modelos
          depends_on:
            - task_key: bronze_to_silver
          spark_python_task:
            python_file: ../../code/ETL/project/verify_swell_models_available.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: if_todos_los_modelos_existen
          depends_on:
            - task_key: validar_existencia_modelos
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.validar_existencia_modelos.values.todos_los_modelos_existen}}"
            right: "true"
        - task_key: crear_modelos
          depends_on:
            - task_key: if_todos_los_modelos_existen
              outcome: "false"
          run_job_task:
            job_id: 1087152440923159
        - task_key: classify_swell_metrics
          depends_on:
            - task_key: if_todos_los_modelos_existen
              outcome: "true"
            - task_key: crear_modelos
          run_if: AT_LEAST_ONE_SUCCESS
          spark_python_task:
            python_file: ../../code/ETL/project/swell_metrics_to_swell_classification.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: silver_to_wave_daily_summary
          depends_on:
            - task_key: bronze_to_silver
          spark_python_task:
            python_file: ../../code/ETL/project/swell_metrics_to_wave_daily_summary.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: silver_to_wave_monthly_classification
          depends_on:
            - task_key: classify_swell_metrics
          spark_python_task:
            python_file: ../../code/ETL/project/swell_classification_wave_monthly_classification.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED