resources:
  jobs:
    cor_reset_tables:
      name: cor_reset_tables
      tasks:
        - task_key: drop_tables
          spark_python_task:
            python_file: ../../code/DDL/drop_tables.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: drop_checkpoints
          spark_python_task:
            python_file: ../../code/DDL/drop_checkpoints.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
        - task_key: drop_models
          spark_python_task:
            python_file: ../../code/DDL/drop_models.py
            parameters:
              - "--ambiente"
              - "${var.catalog_name}"
          email_notifications:
            on_failure:
              - guillermo.hre@gmail.com
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
